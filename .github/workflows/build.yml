
name: Build Scary Monster Pack

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.8'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.8

      - name: Build Mod
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Scary-Monster-Pack-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
